# Escape-task maze grid map via obstacle_map dict spec.
world:
  height: 20
  width: 20
  step_time: 0.1
  sample_time: 0.1
  offset: [0, 0]
  collision_mode: 'stop'
  control_mode: 'auto'
  mdownsample: 1
  obstacle_map:
    name: maze
    resolution: 0.1
    rows: 16
    cols: 16
    exit: bottom_left
    goal_area: center
    goal_rows: 2
    goal_cols: 2
    seed: 42

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.18}
    state: [10, 10, 0]
    goal: [0.9, 0.3, 0]
    vel_max: [2, 1]
    behavior: {name: 'dash'}

    plot:
      show_trail: True
      traj_color: 'g'
      show_trajectory: True
      show_goal: True

    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 5
        angle_range: 3.14
        number: 80
        noise: False
        alpha: 0.3
